<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Torvek's Big Day · CRAFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --night: #0a1015; --panel: #121a22; --cream: #fffaf1; --apricot: #f0dcc2; --lime: #c6ff2e; --orange: #a14505; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--cream); font-family: "Hanken Grotesk", system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 40px 16px 56px; }
  .tag { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--lime); }
  h1 { font-weight: 800; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -.02em; margin: 10px 0 8px; }
  p.sub { color: var(--apricot); font-size: 18px; margin: 0 0 28px; }
  .frame { position: relative; border-radius: 18px; overflow: hidden; background: var(--panel); box-shadow: 0 24px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(198,255,46,.12); }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }
  footer { margin-top: 22px; font-family: "JetBrains Mono", monospace; font-size: 13px; color: rgba(240,220,194,.6); }
  footer b { color: var(--lime); font-weight: 500; }
</style>
</head>
<body>
<main>
  <div class="tag">CRAFT · a Cydonia Space Authority story</div>
  <h1>Torvek's Big Day</h1>
  <p class="sub">Three and a half minutes on one Space where everyone is on the same page.</p>
  <div class="frame">
    <video id="v" controls playsinline preload="metadata" poster="poster.jpg"
           controlslist="nodownload noplaybackrate" disablepictureinpicture disableremoteplayback>
      <source src="torveks-big-day-2k.mp4" type="video/mp4">
      Your browser can't play this video.
    </video>
  </div>
  <footer><b>Sprout suggests. You decide.</b> &nbsp;·&nbsp; Bring us your messiest project. We'll show you its Space.</footer>
</main>
<script>
  const v = document.getElementById("v");
  v.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") e.preventDefault();
  });
</script>
</body>
</html>
